<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0D0D14"/>
  <!-- Outer keycap border -->
  <rect x="4" y="4" width="56" height="56" rx="12" stroke="#7C6AF7" stroke-width="3.5"/>
  <!-- Inner keycap bevel -->
  <rect x="10" y="10" width="44" height="44" rx="7" stroke="#7C6AF7" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Zen outer ring -->
  <circle cx="32" cy="32" r="13" stroke="#7C6AF7" stroke-width="2.2" stroke-opacity="0.6"/>
  <!-- Zen inner ring -->
  <circle cx="32" cy="32" r="7" stroke="#7C6AF7" stroke-width="1.8" stroke-opacity="0.8"/>
  <!-- Center focus dot -->
  <circle cx="32" cy="32" r="3.5" fill="#7C6AF7"/>
</svg>
